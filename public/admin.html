<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mind · Truth Admin</title>
<style>
  :root {
    --bg: #0d1220;
    --card: #161f33;
    --line: #26324b;
    --text: #e6edf9;
    --dim: #93a1bb;
    --accent: #3b82f6;
    --good: #34d399;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2947 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px 16px 64px;
  }
  a { color: var(--accent); }

  /* ---- the gate is a card ---------------------------------------------- */
  #gate { display: flex; justify-content: center; padding-top: 8vh; perspective: 1200px; }
  .gate-card {
    width: min(440px, 94vw);
    background: linear-gradient(160deg, #1b2740, #131c2e);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    transition: transform 0.5s ease, opacity 0.4s ease;
  }
  .gate-card.open { transform: rotateY(180deg); opacity: 0; }
  .gate-card h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: 0.02em; }
  .gate-card p { margin: 0 0 18px; color: var(--dim); font-size: 13px; }
  .gate-card .lock { font-size: 28px; margin-bottom: 10px; }

  input, textarea, select {
    width: 100%;
    background: #101a2c;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
  }
  textarea { min-height: 220px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid rgba(59, 130, 246, 0.4); border-color: var(--accent); }

  button {
    background: #1e2a42;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 16px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #24314d; }
  button.primary { background: linear-gradient(90deg, #2563eb, #3b82f6); border-color: transparent; font-weight: 600; }
  button.ghost { background: transparent; }
  button.small { padding: 5px 10px; font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }

  .status { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: var(--warn); }

  /* ---- console ---------------------------------------------------------- */
  #console { max-width: 900px; margin: 0 auto; }
  #console header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  #console h1 { font-size: 18px; margin: 0; }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .candidate { border-top: 1px solid var(--line); padding: 12px 0; }
  .candidate:first-of-type { border-top: none; }
  .candidate .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hits {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(59, 130, 246, 0.16);
    color: #93c5fd;
  }
  .hits.hot { background: rgba(251, 191, 36, 0.18); color: #fcd34d; }
  .candidate .query { font-weight: 600; }
  .candidate .answer {
    margin: 6px 0 8px;
    color: var(--dim);
    font-size: 13px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .muted { color: var(--dim); font-size: 12px; }
  .empty { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card" id="gateCard">
    <div class="lock">🔒</div>
    <h1>Truth Admin</h1>
    <p>This is the card gate. The key is checked by the Worker — the page cannot open itself.</p>
    <input id="keyInput" type="password" placeholder="Admin key" autocomplete="off">
    <div class="row">
      <button class="primary" id="unlockBtn">Unlock</button>
      <button class="ghost" onclick="location.href='/'">Back to cards</button>
    </div>
    <div class="status" id="gateStatus"></div>
  </div>
</div>

<main id="console" hidden>
  <header>
    <h1>Truth Console</h1>
    <div class="muted">Master answers a query without a model. Candidates are every answer the pipeline produced.</div>
  </header>

  <section class="panel">
    <h2>Candidates to review</h2>
    <div id="candidateList"><p class="empty">Loading…</p></div>
    <div class="row">
      <button class="small" id="reloadBtn">Reload</button>
    </div>
  </section>

  <section class="panel">
    <h2>Editor</h2>
    <label for="query">Query (exact)</label>
    <input id="query" type="text" placeholder="e.g. what is this?" autocomplete="off">
    <div class="row" style="margin-top:10px;">
      <button id="loadBtn">Load</button>
      <button id="clearBtn" class="ghost">Clear</button>
      <span class="muted" id="loadMsg"></span>
    </div>

    <label for="answer">Answer</label>
    <textarea id="answer" placeholder="Write the truth here…"></textarea>
    <div class="muted" id="charCount">0 characters</div>

    <div class="grid2">
      <div>
        <label for="layer">Layer</label>
        <select id="layer">
          <option value="provisional">provisional</option>
          <option value="master">master</option>
        </select>
      </div>
      <div>
        <label for="editor">Your name (for audit)</label>
        <input id="editor" type="text" placeholder="admin">
      </div>
    </div>

    <label>Citations</label>
    <div class="grid2">
      <input class="cite-title" type="text" placeholder="Title 1">
      <input class="cite-url" type="text" placeholder="https://…">
      <input class="cite-title" type="text" placeholder="Title 2">
      <input class="cite-url" type="text" placeholder="https://…">
    </div>

    <div class="row">
      <button class="primary" id="saveBtn">Save truth</button>
      <span class="muted" id="saveMsg"></span>
    </div>
  </section>
</main>

<script>
  const KEY_STORE = 'mind_admin_key';
  let adminKey = sessionStorage.getItem(KEY_STORE) || '';

  const $ = (id) => document.getElementById(id);
  const status = (el, text) => { el.textContent = text || ''; };

  async function api(path, init = {}) {
    const headers = { 'x-admin-key': adminKey, ...(init.headers || {}) };
    if (init.body) headers['content-type'] = 'application/json';
    const res = await fetch(path, { ...init, headers });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const message = data?.error?.message || `Request failed (${res.status})`;
      throw new Error(message);
    }
    return data;
  }

  function showConsole() {
    $('gate').style.display = 'none';
    $('console').hidden = false;
    $('editor').value = localStorage.getItem('mind_admin_editor') || '';
    loadCandidates();
  }

  async function unlock() {
    const key = $('keyInput').value.trim();
    if (!key) { status($('gateStatus'), 'Enter the admin key.'); return; }
    adminKey = key;
    status($('gateStatus'), 'Checking…');
    try {
      await api('/api/admin/unlock', { method: 'POST' });
      sessionStorage.setItem(KEY_STORE, key);
      $('gateCard').classList.add('open');
      setTimeout(showConsole, 260);
    } catch (err) {
      adminKey = '';
      sessionStorage.removeItem(KEY_STORE);
      status($('gateStatus'), err.message);
    }
  }

  async function loadCandidates() {
    const box = $('candidateList');
    box.innerHTML = '<p class="empty">Loading…</p>';
    try {
      const { candidates, promoteAt } = await api('/api/truth/candidates');
      if (!candidates.length) {
        box.innerHTML = '<p class="empty">No candidates yet. Every answer the app gives lands here.</p>';
        return;
      }
      box.innerHTML = '';
      for (const item of candidates) {
        const row = document.createElement('div');
        row.className = 'candidate';

        const top = document.createElement('div');
        top.className = 'top';

        const hits = document.createElement('span');
        hits.className = 'hits' + (item.suggested ? ' hot' : '');
        hits.textContent = String(item.hits || 0) + '×';
        hits.title = `Seen ${item.hits || 0} time(s); promotion is suggested at ${promoteAt}.`;

        const query = document.createElement('span');
        query.className = 'query';
        query.textContent = item.query || item.input || '';

        top.append(hits, query);

        const answer = document.createElement('div');
        answer.className = 'answer';
        answer.textContent = item.answer || '';

        const row2 = document.createElement('div');
        row2.className = 'row';
        row2.style.marginTop = '0';

        const edit = document.createElement('button');
        edit.className = 'small ghost';
        edit.textContent = 'Edit';
        edit.onclick = () => {
          $('query').value = item.input || item.query || '';
          $('answer').value = item.answer || '';
          $('charCount').textContent = ($('answer').value || '').length + ' characters';
          window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        };

        for (const layer of ['provisional', 'master']) {
          const promote = document.createElement('button');
          promote.className = 'small' + (layer === 'master' ? ' primary' : '');
          promote.textContent = '→ ' + layer;
          promote.onclick = () => saveTruth({ layer, input: item.input || item.query, answer: item.answer });
          row2.append(promote);
        }

        row2.append(edit);
        row.append(top, answer, row2);
        box.append(row);
      }
    } catch (err) {
      box.innerHTML = '<p class="empty">' + err.message + '</p>';
    }
  }

  async function saveTruth(override) {
    const input = override?.input ?? $('query').value.trim();
    const answer = override?.answer ?? $('answer').value;
    const layer = override?.layer ?? $('layer').value;
    const editor = $('editor').value.trim() || 'admin';
    const msg = $('saveMsg');

    if (!input || !answer.trim()) {
      status(msg, 'Query and answer are both required.');
      return;
    }

    const citations = [];
    const titles = [...document.querySelectorAll('.cite-title')];
    const urls = [...document.querySelectorAll('.cite-url')];
    titles.forEach((t, i) => {
      const title = t.value.trim();
      const url = (urls[i]?.value || '').trim();
      if (title && url) citations.push({ title, url });
    });

    localStorage.setItem('mind_admin_editor', editor);
    status(msg, 'Saving…');

    try {
      const data = await api('/api/truth/save', {
        method: 'POST',
        body: JSON.stringify({ input, answer, layer, editor, citations }),
      });
      status(msg, `Saved as ${data.truth.layer} (${String(data.truth.id).slice(0, 10)}…).`);
      loadCandidates();
    } catch (err) {
      status(msg, err.message);
    }
  }

  async function loadTruth() {
    const input = $('query').value.trim();
    const msg = $('loadMsg');
    if (!input) { status(msg, 'Enter a query first.'); return; }
    status(msg, 'Loading…');
    try {
      const truth = await api('/api/truth/resolve', { method: 'POST', body: JSON.stringify({ input }) });
      if (truth.layer === 'none') {
        status(msg, 'No truth and no candidate for that query yet.');
        return;
      }
      $('answer').value = truth.answer || '';
      $('charCount').textContent = ($('answer').value || '').length + ' characters';
      if (truth.layer !== 'candidate') $('layer').value = truth.layer;
      const cites = Array.isArray(truth.citations) ? truth.citations : [];
      cites.slice(0, 2).forEach((citation, i) => {
        const title = document.querySelectorAll('.cite-title')[i];
        const url = document.querySelectorAll('.cite-url')[i];
        if (title) title.value = citation.title || '';
        if (url) url.value = citation.url || '';
      });
      status(msg, `Loaded ${truth.layer}${truth.hits ? ` · ${truth.hits} hit(s)` : ''}.`);
    } catch (err) {
      status(msg, err.message);
    }
  }

  $('unlockBtn').onclick = unlock;
  $('keyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
  $('reloadBtn').onclick = loadCandidates;
  $('loadBtn').onclick = loadTruth;
  $('saveBtn').onclick = () => saveTruth();
  $('clearBtn').onclick = () => {
    $('query').value = '';
    $('answer').value = '';
    $('charCount').textContent = '0 characters';
    document.querySelectorAll('.cite-title, .cite-url').forEach((el) => { el.value = ''; });
    status($('loadMsg'), '');
    status($('saveMsg'), '');
  };
  $('answer').addEventListener('input', () => {
    $('charCount').textContent = ($('answer').value || '').length + ' characters';
  });

  // A key from the app's gate card is reused here, so the card is entered once.
  if (adminKey) {
    $('keyInput').value = adminKey;
    unlock();
  }
</script>
</body>
</html>
